_format_version: "2.1"

plugins:
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - HEAD
        - PUT
        - PATCH
        - POST
        - DELETE
        - OPTIONS
      # Every header the supabase-js clients send. A missing entry fails the browser
      # preflight and the call never leaves the page — e.g. supabase-js sends
      # x-supabase-api-version on auth calls, and without it sign-up/sign-in die with
      # "Failed to fetch" while curl against the same endpoint works fine.
      headers:
        - Accept
        - Accept-Version
        - Accept-Profile
        - Content-Length
        - Content-MD5
        - Content-Type
        - Content-Profile
        - Date
        - Prefer
        - Range
        - X-Auth-Token
        - X-HTTP-Method-Override
        - Authorization
        - apikey
        - cache-control
        - x-client-info
        - x-supabase-api-version
        - x-upsert
      exposed_headers:
        - X-Auth-Token
        - Content-Range
        - Content-Encoding
        - X-Supabase-Api-Version
      credentials: true
      max_age: 3600

services:
  - name: auth-v1
    url: http://auth:9999/
    routes:
      - name: auth-v1-route
        strip_path: true
        paths:
          - /auth/v1/

  - name: rest-v1
    url: http://rest:3000/
    routes:
      - name: rest-v1-route
        strip_path: true
        paths:
          - /rest/v1/
    plugins:
      - name: key-auth
        config:
          key_names: [apikey]

  - name: realtime-v1
    url: http://realtime:4000/socket/
    routes:
      - name: realtime-v1-route
        strip_path: true
        paths:
          - /realtime/v1/
    plugins:
      - name: key-auth
        config:
          key_names: [apikey]

  - name: storage-v1
    url: http://storage:5000/
    routes:
      - name: storage-v1-route
        strip_path: true
        paths:
          - /storage/v1/

consumers:
  - username: anon
    keyauth_credentials:
      - key: $ANON_KEY
  - username: service_role
    keyauth_credentials:
      - key: $SERVICE_ROLE_KEY
