# Full single-user stack: Caddy + frontend + backend API/worker + self-hosted Supabase.
# Installer uses exact-SHA prebuilt application images; local `--build` is an
# explicit emergency/development path only.
#
# ONE env file: the repo-root .env (see .env.example). Browser traffic uses one
# Caddy origin; internal services keep private Docker-network URLs.

services:
  db:
    image: supabase/postgres:15.1.1.78
    container_name: aiautoclicker-db
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: postgres
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    volumes:
      - supabase-db-data:/var/lib/postgresql/data
      - ./infra/supabase/init/zz1-set-role-passwords.sh:/docker-entrypoint-initdb.d/zz1-set-role-passwords.sh:ro
      - ./infra/supabase/init/zz2-run-app-migrations.sh:/docker-entrypoint-initdb.d/zz2-run-app-migrations.sh:ro
      - ./infra/supabase/migrate.sh:/migrate.sh:ro
      - ./infra/supabase/migrations:/migrations-src:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    # One-shot: applies migrations not yet recorded in schema_migrations.
    image: supabase/postgres:15.1.1.78
    container_name: aiautoclicker-migrate
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: postgres
      PGDATABASE: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./infra/supabase/migrate.sh:/migrate.sh:ro
      - ./infra/supabase/migrations:/migrations-src:ro
    entrypoint: ["sh", "/migrate.sh"]

  auth:
    image: supabase/gotrue:v2.170.0
    container_name: aiautoclicker-auth
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${SUPABASE_PUBLIC_URL:-http://localhost}/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost}
      GOTRUE_URI_ALLOW_LIST: "*"
      GOTRUE_DISABLE_SIGNUP: "${DISABLE_SIGNUP:-true}"
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      # No SMTP by default; installer creates an already-confirmed admin user.
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${ENABLE_GOOGLE_AUTH:-false}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${NEXT_PUBLIC_APP_URL:-http://localhost}/auth/callback

  rest:
    image: postgrest/postgrest:v12.2.0
    container_name: aiautoclicker-rest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}

  realtime:
    image: supabase/realtime:v2.34.7
    container_name: aiautoclicker-realtime
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: postgres
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_AFTER_CONNECT_QUERY: "SET search_path TO _realtime"
      DB_ENC_KEY: supabaserealtime
      API_JWT_SECRET: ${JWT_SECRET}
      SECRET_KEY_BASE: ${JWT_SECRET}${JWT_SECRET}
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: 10000
      APP_NAME: realtime
      SELF_HOST_TENANT_NAME: realtime
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"

  storage:
    image: supabase/storage-api:v1.11.13
    container_name: aiautoclicker-storage
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      PGRST_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      GLOBAL_S3_BUCKET: stub
    volumes:
      - supabase-storage-data:/var/lib/storage

  storage-init:
    image: supabase/postgres:15.1.1.78
    container_name: aiautoclicker-storage-init
    restart: "no"
    depends_on:
      storage:
        condition: service_started
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./infra/supabase/init/create-captcha-bucket.sh:/create-captcha-bucket.sh:ro
    entrypoint: ["sh", "/create-captcha-bucket.sh"]

  kong:
    image: kong:2.8.1
    container_name: aiautoclicker-kong
    restart: unless-stopped
    depends_on:
      - auth
      - rest
      - realtime
      - storage
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /tmp/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,key-auth,cors
      ANON_KEY: ${ANON_KEY}
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
    volumes:
      - ./infra/supabase/kong.yml:/kong.yml.tpl:ro
    entrypoint: ["sh", "-c", "sed 's|$$ANON_KEY|'\"${ANON_KEY}\"'|g; s|$$SERVICE_ROLE_KEY|'\"${SERVICE_ROLE_KEY}\"'|g' /kong.yml.tpl > /tmp/kong.yml; exec /docker-entrypoint.sh kong docker-start"]
    # Local installer/admin access only. Public browser requests go through Caddy.
    ports:
      - "127.0.0.1:54321:8000"
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: aiautoclicker-backend:latest
    container_name: aiautoclicker-api
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Per-install candidate data lives outside the prebuilt image and survives
      # git/image updates. The application only reads it when the explicit
      # candidate loader is invoked.
      - ./backend/data/candidate-local:/app/data/candidate-local:ro
    ports:
      - "127.0.0.1:8000:8000"
    shm_size: "1gb"
    depends_on:
      kong:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    image: aiautoclicker-backend:latest
    container_name: aiautoclicker-worker
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./backend/data/candidate-local:/app/data/candidate-local:ro
    command: ["python", "worker_main.py"]
    depends_on:
      api:
        condition: service_healthy
      kong:
        condition: service_healthy
    shm_size: "1gb"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: aiautoclicker-frontend:latest
    container_name: aiautoclicker-frontend
    restart: unless-stopped
    environment:
      # Server-side calls use private Kong. The browser gets the public anon key
      # from a first-party runtime cookie and uses the Caddy same-origin URL.
      SUPABASE_URL: http://kong:8000
      SUPABASE_ANON_KEY: ${ANON_KEY}
      GOOGLE_AUTH_ENABLED: ${NEXT_PUBLIC_GOOGLE_AUTH_ENABLED:-false}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    container_name: aiautoclicker-caddy
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      kong:
        condition: service_healthy
      frontend:
        condition: service_started
    environment:
      CADDY_SITE_ADDRESS: "${CADDY_SITE_ADDRESS:-:80}"
    ports:
      # Direct mode uses 80/443. When another reverse proxy already owns those
      # host ports, the installer switches these bindings to loopback 18080/18443.
      - "${CADDY_HTTP_BIND:-80}:80"
      - "${CADDY_HTTPS_BIND:-443}:443"
      - "${CADDY_HTTPS_BIND:-443}:443/udp"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  supabase-db-data:
  supabase-storage-data:
  caddy-data:
  caddy-config:
