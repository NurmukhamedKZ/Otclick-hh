[project]
name = "aiautoclicker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "playwright>=1.60.0",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "supabase>=2.10.0",
    "cryptography>=43.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    "langchain>=1.3.2",
    "langchain-openai>=1.2.2",
    "langsmith>=0.8.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.15.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# Explicit select: ruff's own default (with no [tool.ruff.lint] section) is much
# wider than E4/E7/E9/F and pulls in opinionated families (BLE/TRY/SIM/FURB/S/...)
# that fight this codebase's documented fail-open/broad-except conventions
# (see CLAUDE.md: "never crash the loop", "fail-open"). Keep it to the
# uncontroversial, already-clean set: pyflakes, pycodestyle errors, import
# sorting, and stdlib modernization.
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.isort]
# The backend imports its own package as top-level `app` (it runs with backend/
# on sys.path). Ruff's automatic first-party detection answers differently
# depending on whether a sibling `app/` directory happens to exist beside the
# checkout, which silently flips the expected import order of every backend
# file. Pin it so a developer's working copy and CI agree.
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
# `load_dotenv()` must run before app imports read settings; tests must set
# env vars before importing app modules (see CLAUDE.md).
"backend/app/main.py" = ["E402"]
"backend/worker_main.py" = ["E402"]
"backend/tests/test_*.py" = ["E402"]
