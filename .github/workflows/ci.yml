name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "feature/**"
      - "integration/**"
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate installer and compose contract
        run: |
          bash -n install.sh
          bash -n install-one.sh
          bash -n install-update.sh
          python3 -m py_compile infra/bootstrap.py backend/scripts/load_candidate_data.py
          python3 infra/bootstrap.py --openai-key ci-placeholder
          docker compose -f docker-compose.yml -f docker-compose.prebuilt.yml config >/dev/null
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --dev
      - run: uv run ruff check backend
      # tests/integration + tests/e2e auto-skip without a running local stack
      - run: uv run pytest tests -q
        working-directory: backend

  ext:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ext
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ext/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      # Placeholder values: the build only bakes them into the bundle.
      - run: npm run build
        env:
          VITE_API_BASE: http://localhost:8000
          VITE_APP_BASE: http://localhost:3000
          VITE_SUPABASE_URL: http://localhost:54321
          VITE_SUPABASE_ANON_KEY: ci-placeholder

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://localhost
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          NEXT_PUBLIC_API_URL: http://localhost
          NEXT_PUBLIC_GOOGLE_AUTH_ENABLED: "false"
