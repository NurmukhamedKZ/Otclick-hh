name: Integrate main once

on:
  push:
    branches: [integration/product-features-plus-main]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/product-features-plus-main
          fetch-depth: 0
      - name: Merge main preserving product side on conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-ff -X ours origin/main -m "merge: integrate main infrastructure into product line"

          # The product line already owns migrations 034..041. The cover-letter
          # migration added on main must run after them, not compete for 034.
          if [[ -f infra/supabase/migrations/034_cover_letter_prompt_version.sql ]]; then
            git mv infra/supabase/migrations/034_cover_letter_prompt_version.sql \
              infra/supabase/migrations/042_cover_letter_prompt_version.sql
            git commit -m "fix: sequence cover-letter migration after vacancy funnel migrations"
          fi

          git push origin HEAD:integration/product-features-plus-main
